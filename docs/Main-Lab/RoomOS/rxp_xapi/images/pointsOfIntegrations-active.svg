<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Published RoomOS xAPI integration methods</title>
  <desc id="desc">A RoomOS device connects to SSH, HTTP with Postman, and the on-device Macro Editor.</desc>
  <defs>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a6a"/>
      <stop offset="1" stop-color="#f06432"/>
    </linearGradient>
    <linearGradient id="method" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00bceb"/>
      <stop offset="1" stop-color="#1170cf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="#0d1726"/>
  <text x="600" y="62" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">RoomOS xAPI Integration Methods</text>
  <g filter="url(#shadow)">
    <rect x="70" y="142" width="300" height="260" rx="28" fill="url(#device)"/>
    <rect x="132" y="196" width="176" height="112" rx="16" fill="#172b4d"/>
    <circle cx="174" cy="252" r="18" fill="#00bceb"/>
    <circle cx="220" cy="252" r="18" fill="#ffd03c"/>
    <circle cx="266" cy="252" r="18" fill="#63e6be"/>
    <text x="220" y="356" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">RoomOS device</text>
  </g>
  <path d="M370 272 H470" stroke="#8fa7c4" stroke-width="8" stroke-linecap="round"/>
  <circle cx="470" cy="272" r="11" fill="#8fa7c4"/>
  <g font-family="Arial, sans-serif" fill="#ffffff" filter="url(#shadow)">
    <rect x="500" y="105" width="625" height="95" rx="22" fill="url(#method)"/>
    <text x="540" y="147" font-size="28" font-weight="700">SSH</text>
    <text x="540" y="177" font-size="20">Local terminal access • TCP port 22</text>
    <rect x="500" y="215" width="625" height="95" rx="22" fill="url(#method)"/>
    <text x="540" y="257" font-size="28" font-weight="700">HTTP + Postman</text>
    <text x="540" y="287" font-size="20">Local GET, POST, and webhook feedback</text>
    <rect x="500" y="325" width="625" height="95" rx="22" fill="url(#method)"/>
    <text x="540" y="367" font-size="28" font-weight="700">Macro Editor</text>
    <text x="540" y="397" font-size="20">JavaScript running on the RoomOS device</text>
  </g>
</svg>
